# Repasse para a API (Node em HTTP só na máquina local). Copie para /etc/nginx/snippets/gestao-proxy.conf
proxy_pass http://gestao_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Upgrade só quando o navegador pede (Socket.IO); nas outras rotas o map deixa Connection vazio (keepalive com a API)
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# A API manda os próprios cabeçalhos de segurança; o nginx manda os do site: esconde os da API para não duplicar
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
