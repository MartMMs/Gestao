# Cabeçalhos de segurança comuns aos sites do Gestão. Incluído no server E em toda location que tenha add_header
# próprio: no nginx, um add_header dentro da location descarta todos os herdados do server.
# Copie para /etc/nginx/snippets/gestao-seguranca.conf
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
