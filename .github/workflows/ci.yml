name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Os tipos do Prisma vêm do cliente gerado: sem ele, o typecheck do backend falha
      - run: npx prisma generate --schema=prisma/schema.prisma
        working-directory: backend
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestao_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestao_ci
      # Os testes rodam todos do mesmo IP; limites do totem mais altos só no CI
      TOTEM_MAX_REQUISICOES_POR_MINUTO: '1000'
      TOTEM_MAX_RESERVAS_POR_IP: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Gerar segredos efêmeros do CI
        # Gerados a cada execução (nunca versionados), para não servirem em nenhum outro ambiente
        run: |
          jwt=$(openssl rand -hex 32)
          senha=$(openssl rand -hex 16)
          echo "::add-mask::$jwt"
          echo "::add-mask::$senha"
          echo "JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$senha" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma generate --schema=prisma/schema.prisma
        working-directory: backend
      - run: npx prisma migrate deploy --schema=prisma/schema.prisma
        working-directory: backend
      - run: npx tsx prisma/seed.ci.ts
        working-directory: backend
      - run: npx playwright install chromium --with-deps
      - name: Start API and Vite
        run: |
          (cd backend && npx tsx server.ts) &
          npm run dev &
          for i in $(seq 1 60); do
            ui=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ || true)
            api=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3333/api/colaboradores || true)
            if [ "$ui" = "200" ] && [ "$api" = "401" ]; then
              echo "stack ok (ui 200, api 401 sem token)"
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for ports 3000/3333"
          exit 1
      - name: Playwright
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
          PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000'
          PLAYWRIGHT_API_URL: 'http://127.0.0.1:3333/api'
        run: npx playwright test
